<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LifecycleSeal Bundler</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; }
    textarea { width: 100%; height: 200px; }
    button { padding: 0.5rem 1rem; margin-top: 1rem; }
    pre { background: #f5f5f5; padding: 1rem; overflow: auto; }
  </style>
</head>
<body>
  <h1>LifecycleSeal — Local Bundler</h1>
  <p>Paste your lifecycle JSON below. This is a static demo; full sealing happens in the Python CLI with real keys.</p>
  <textarea id="data" placeholder='{"job_id": "JOB-001", "client": "...", ...}'></textarea>
  <button onclick="bundle()">Generate Summary Pack (stub)</button>
  <pre id="out"></pre>
  <script>
    function bundle() {
      try {
        const data = JSON.parse(document.getElementById('data').value);
        const summary = {
          version: "1",
          type: "job_lifecycle_summary",
          job_id: data.job_id || "unknown",
          client: data.client || "",
          pack_count: 1 + (data.field_pack_hashes || []).length + (data.close_pack_hash ? 1 : 0),
          status: data.status || "bundled",
          note: "Use Python CLI for real QuantumGuard sealing"
        };
        document.getElementById('out').textContent = JSON.stringify(summary, null, 2);
      } catch (e) {
        document.getElementById('out').textContent = "Invalid JSON: " + e.message;
      }
    }
  </script>
</body>
</html>
